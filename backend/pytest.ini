[pytest]
# Pytest configuration for TulaPramaan backend tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options (when using --cov)
# Run with: pytest --cov=services --cov=models --cov-report=html
[coverage:run]
source = services,models
omit = 
    tests/*
    */migrations/*
    */venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:

# Markers for test categorization
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, external services)
    slow: Slow-running tests
    property: Property-based tests using Hypothesis
    security: Security-focused tests

# Hypothesis settings
[hypothesis]
max_examples = 100
derandomize = false

# Asyncio mode
asyncio_mode = auto
